name: MauzoChap Nightly Backup (Google Drive)

on:
  schedule:
    # 21:00 UTC every day = 00:00 (midnight) Africa/Dar_es_Salaam (UTC+3)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      skip_retention:
        description: "Skip 30-day retention cleanup for this manual run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mauzochap-nightly-backup
  cancel-in-progress: false

jobs:
  database-backup:
    name: Dump, Verify & Upload to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Africa/Dar_es_Salaam
      PGSSLMODE: require

    steps:
      - name: Checkout repository (read-only)
        uses: actions/checkout@v4

      - name: Validate required GitHub Actions Secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          MISSING=()
          for VAR in SUPABASE_DB_URL GDRIVE_CLIENT_ID GDRIVE_CLIENT_SECRET GDRIVE_REFRESH_TOKEN GDRIVE_FOLDER_ID; do
            if [ -z "${!VAR:-}" ]; then
              MISSING+=("$VAR")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions Secrets: ${MISSING[*]}"
            echo "Configure them at Settings -> Secrets and variables -> Actions before running this workflow."
            exit 1
          fi
          if [ -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ] && [ ${#BACKUP_ENCRYPTION_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE is set but shorter than 16 characters."
            exit 1
          fi
          if [ -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]; then
            echo "All required secrets are present. Client-side AES-256 GPG encryption: ENABLED."
          else
            echo "All 5 required secrets are present. Client-side encryption: DISABLED (add BACKUP_ENCRYPTION_PASSPHRASE anytime to enable)."
          fi

      - name: Install PostgreSQL 17 client tools & GPG
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version
          pg_restore --version
          node --version

      - name: Compute Tanzania backup timestamps & prepare secure temp directory
        id: meta
        run: |
          set -euo pipefail
          BACKUP_DATE_EAT=$(TZ="Africa/Dar_es_Salaam" date +%Y-%m-%d)
          BACKUP_TIME_EAT=$(TZ="Africa/Dar_es_Salaam" date +%H%M%S)
          TIMESTAMP_EAT=$(TZ="Africa/Dar_es_Salaam" date +%Y-%m-%dT%H:%M:%S%z)
          TIMESTAMP_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          WORK_DIR=$(mktemp -d "${RUNNER_TEMP}/mauzochap-backup.XXXXXX")
          chmod 700 "$WORK_DIR"

          echo "backup_date_eat=${BACKUP_DATE_EAT}" >> "$GITHUB_OUTPUT"
          echo "backup_time_eat=${BACKUP_TIME_EAT}" >> "$GITHUB_OUTPUT"
          echo "timestamp_eat=${TIMESTAMP_EAT}" >> "$GITHUB_OUTPUT"
          echo "timestamp_utc=${TIMESTAMP_UTC}" >> "$GITHUB_OUTPUT"
          echo "work_dir=${WORK_DIR}" >> "$GITHUB_OUTPUT"
          echo "folder_name=MauzoChap_Backup_${BACKUP_DATE_EAT}" >> "$GITHUB_OUTPUT"
          echo "file_prefix=MauzoChap_Backup_${BACKUP_DATE_EAT}_${BACKUP_TIME_EAT}_EAT" >> "$GITHUB_OUTPUT"

      - name: Create read-only PostgreSQL backup & verify archive integrity (Stage 1)
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          WORK_DIR="${{ steps.meta.outputs.work_dir }}"
          PREFIX="${{ steps.meta.outputs.file_prefix }}"
          DUMP_FILE="${WORK_DIR}/${PREFIX}.dump"
          TOC_FILE="${WORK_DIR}/${PREFIX}.toc"

          # Strictly read-only logical backup of public, auth, and storage schemas
          pg_dump \
            --dbname="$SUPABASE_DB_URL" \
            --format=custom \
            --compress=6 \
            --no-owner \
            --no-privileges \
            --schema=public \
            --schema=auth \
            --schema=storage \
            --file="$DUMP_FILE"

          if [ ! -s "$DUMP_FILE" ]; then
            echo "::error::pg_dump produced an empty backup file."
            exit 1
          fi

          # Verify custom archive TOC is valid and readable via pg_restore --list (read-only)
          pg_restore --list "$DUMP_FILE" > "$TOC_FILE"

          TOC_LINES=$(wc -l < "$TOC_FILE")
          PUBLIC_TABLES=$(grep -cE " TABLE public " "$TOC_FILE" || true)
          AUTH_TABLES=$(grep -cE " TABLE auth " "$TOC_FILE" || true)
          DUMP_SIZE=$(stat -c%s "$DUMP_FILE")
          DUMP_SHA256=$(sha256sum "$DUMP_FILE" | awk '{print $1}')

          if [ "$PUBLIC_TABLES" -lt 10 ]; then
            echo "::error::Verification failed: expected >= 10 public tables in backup TOC, found ${PUBLIC_TABLES}."
            exit 1
          fi
          if [ "$AUTH_TABLES" -lt 5 ]; then
            echo "::error::Verification failed: expected >= 5 auth tables in backup TOC, found ${AUTH_TABLES}."
            exit 1
          fi

          echo "Stage 1 verified: dump_size=${DUMP_SIZE} bytes, toc_entries=${TOC_LINES}, public_tables=${PUBLIC_TABLES}, auth_tables=${AUTH_TABLES}"
          echo "dump_file=${DUMP_FILE}" >> "$GITHUB_OUTPUT"
          echo "dump_size=${DUMP_SIZE}" >> "$GITHUB_OUTPUT"
          echo "dump_sha256=${DUMP_SHA256}" >> "$GITHUB_OUTPUT"
          echo "toc_entries=${TOC_LINES}" >> "$GITHUB_OUTPUT"
          echo "public_tables=${PUBLIC_TABLES}" >> "$GITHUB_OUTPUT"
          echo "auth_tables=${AUTH_TABLES}" >> "$GITHUB_OUTPUT"

      - name: Prepare backup artifacts & optional AES-256 encryption (Stage 2)
        id: package
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          WORK_DIR="${{ steps.meta.outputs.work_dir }}"
          PREFIX="${{ steps.meta.outputs.file_prefix }}"
          DUMP_FILE="${{ steps.dump.outputs.dump_file }}"
          ORIG_SHA256="${{ steps.dump.outputs.dump_sha256 }}"
          SHA_FILE="${WORK_DIR}/${PREFIX}.sha256"
          MANIFEST_FILE="${WORK_DIR}/${PREFIX}.manifest.json"

          if [ -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]; then
            UPLOAD_FILE="${WORK_DIR}/${PREFIX}.dump.gpg"
            PASS_FILE="${WORK_DIR}/.passphrase"
            umask 077
            printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$PASS_FILE"

            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase-file "$PASS_FILE" \
              --symmetric \
              --cipher-algo AES256 \
              --digest-algo SHA512 \
              --s2k-mode 3 \
              --s2k-digest-algo SHA512 \
              --s2k-count 65011712 \
              --compress-algo none \
              --output "$UPLOAD_FILE" \
              "$DUMP_FILE"

            if [ ! -s "$UPLOAD_FILE" ]; then
              echo "::error::GPG encryption produced an empty file."
              exit 1
            fi

            DECRYPTED_SHA256=$(gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase-file "$PASS_FILE" \
              --decrypt \
              "$UPLOAD_FILE" | sha256sum | awk '{print $1}')

            rm -f "$PASS_FILE"

            if [ "$DECRYPTED_SHA256" != "$ORIG_SHA256" ]; then
              echo "::error::Stage 2 verification failed: decrypted SHA-256 does not match original pg_dump SHA-256!"
              exit 1
            fi

            rm -f "$DUMP_FILE"
            ARCHIVE_FORMAT="pg_dump custom (compressed) + GPG AES256-SHA512-MDC"
            IS_ENCRYPTED="true"
            echo "Stage 2 verified: AES-256 encryption + round-trip decryption SHA-256 match."
          else
            UPLOAD_FILE="$DUMP_FILE"
            ARCHIVE_FORMAT="pg_dump custom (compressed, unencrypted)"
            IS_ENCRYPTED="false"
            echo "Stage 2: Client-side encryption disabled (BACKUP_ENCRYPTION_PASSPHRASE not set); uploading verified compressed .dump archive."
          fi

          UPLOAD_SIZE=$(stat -c%s "$UPLOAD_FILE")
          UPLOAD_SHA256=$(sha256sum "$UPLOAD_FILE" | awk '{print $1}')
          printf '%s  %s\n' "$UPLOAD_SHA256" "$(basename "$UPLOAD_FILE")" > "$SHA_FILE"

          export M_BACKUP_DATE_EAT="${{ steps.meta.outputs.backup_date_eat }}"
          export M_TIMESTAMP_EAT="${{ steps.meta.outputs.timestamp_eat }}"
          export M_TIMESTAMP_UTC="${{ steps.meta.outputs.timestamp_utc }}"
          export M_TRIGGER="${{ github.event_name }}"
          export M_RUN_ID="${{ github.run_id }}"
          export M_ARCHIVE_FORMAT="$ARCHIVE_FORMAT"
          export M_IS_ENCRYPTED="$IS_ENCRYPTED"
          export M_TOC_ENTRIES="${{ steps.dump.outputs.toc_entries }}"
          export M_PUBLIC_TABLES="${{ steps.dump.outputs.public_tables }}"
          export M_AUTH_TABLES="${{ steps.dump.outputs.auth_tables }}"
          export M_DUMP_SIZE="${{ steps.dump.outputs.dump_size }}"
          export M_DUMP_SHA256="${{ steps.dump.outputs.dump_sha256 }}"
          export M_UPLOAD_FILE="$UPLOAD_FILE"
          export M_UPLOAD_SIZE="$UPLOAD_SIZE"
          export M_UPLOAD_SHA256="$UPLOAD_SHA256"

          node - <<'JS' > "$MANIFEST_FILE"
          const path = require("node:path");
          const isEncrypted = process.env.M_IS_ENCRYPTED === "true";
          const manifest = {
            project: "MauzoChap",
            supabase_project_ref: "rcinghijelhlehfycjka",
            backup_date_eat: process.env.M_BACKUP_DATE_EAT,
            timestamp_eat: process.env.M_TIMESTAMP_EAT,
            timestamp_utc: process.env.M_TIMESTAMP_UTC,
            trigger: process.env.M_TRIGGER,
            workflow_run_id: process.env.M_RUN_ID,
            schemas: ["public", "auth", "storage"],
            archive_format: process.env.M_ARCHIVE_FORMAT,
            client_side_encrypted: isEncrypted,
            toc_entries: Number(process.env.M_TOC_ENTRIES),
            public_tables: Number(process.env.M_PUBLIC_TABLES),
            auth_tables: Number(process.env.M_AUTH_TABLES),
            dump_size_bytes: Number(process.env.M_DUMP_SIZE),
            dump_sha256: process.env.M_DUMP_SHA256,
            uploaded_filename: path.basename(process.env.M_UPLOAD_FILE),
            uploaded_size_bytes: Number(process.env.M_UPLOAD_SIZE),
            uploaded_sha256: process.env.M_UPLOAD_SHA256,
            round_trip_decryption_verified: isEncrypted,
          };
          console.log(JSON.stringify(manifest, null, 2));
          JS

          echo "backup_file=${UPLOAD_FILE}" >> "$GITHUB_OUTPUT"
          echo "sha_file=${SHA_FILE}" >> "$GITHUB_OUTPUT"
          echo "manifest_file=${MANIFEST_FILE}" >> "$GITHUB_OUTPUT"
          echo "backup_size=${UPLOAD_SIZE}" >> "$GITHUB_OUTPUT"
          echo "is_encrypted=${IS_ENCRYPTED}" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Drive, verify remote MD5/size & apply 30-day retention (Stages 3 & 4)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "${{ inputs.skip_retention }}" = "true" ]; then
            EXTRA_ARGS+=(--skip-retention)
          fi

          node scripts/gdrive-backup-sync.mjs \
            --backup-date "${{ steps.meta.outputs.backup_date_eat }}" \
            --backup-file "${{ steps.package.outputs.backup_file }}" \
            --checksum-file "${{ steps.package.outputs.sha_file }}" \
            --manifest-file "${{ steps.package.outputs.manifest_file }}" \
            --retention-days 30 \
            --result-json "${{ steps.meta.outputs.work_dir }}/result.json" \
            "${EXTRA_ARGS[@]}"

      - name: Publish audit summary to GitHub Actions
        if: success()
        run: |
          set -euo pipefail
          node - "${{ steps.meta.outputs.work_dir }}/result.json" "${{ steps.package.outputs.is_encrypted }}" >> "$GITHUB_STEP_SUMMARY" <<'JS'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const isEncrypted = process.argv[3] === "true";
          const trashed = data.trashed_expired_folders.join(", ") || "None";
          console.log("### MauzoChap Backup Summary");
          console.log(`- **Status:** \`${data.status}\``);
          console.log(`- **Backup Date (EAT):** \`${data.backup_date_eat}\``);
          console.log(`- **Client-Side Encryption:** \`${isEncrypted ? "AES-256 GPG (enabled)" : "Disabled (add BACKUP_ENCRYPTION_PASSPHRASE to enable)"}\``);
          console.log(`- **Destination:** \`${data.root_folder_name}/${data.date_folder_name}/\``);
          console.log(`- **Retention Policy:** \`${data.retention_days} days\` (skipped: \`${data.retention_skipped}\`)`);
          console.log(`- **Valid Backup Folders Seen:** \`${data.valid_backup_folders_seen}\``);
          console.log(`- **Expired Folders Moved to Trash:** \`${trashed}\``);
          console.log("");
          console.log("| File | Size (bytes) | Verified (MD5 + Size) |");
          console.log("| --- | ---: | :---: |");
          for (const item of data.uploaded_files) {
            console.log(`| \`${item.name}\` | ${item.size_bytes} | ${item.verified ? "Yes" : "No"} |`);
          }
          JS

      - name: Clean up temporary files from runner
        if: always()
        run: |
          WORK_DIR="${{ steps.meta.outputs.work_dir }}"
          if [ -n "${WORK_DIR}" ] && [ -d "${WORK_DIR}" ]; then
            rm -rf "$WORK_DIR"
            echo "Temporary runner backup directory removed."
          fi
